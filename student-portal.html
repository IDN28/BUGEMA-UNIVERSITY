<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Bugema University</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="portal-body portal-student-body">
    <header class="portal-header">
        <div class="portal-brand">
            <a href="index.html">Bugema University</a>
        </div>
        <nav class="portal-nav">
            <a href="index.html">Home</a>
            <a href="contact.html">Support</a>
        </nav>
    </header>

    <main class="portal-panel">
        <div class="portal-card">
            <span class="portal-tag portal-student-tag">Student Portal</span>
            <h1>Welcome Back</h1>
            <p>Access your courses, timetable, fees, and academic records.</p>

            <form class="portal-form">
                <label>
                    Student Number
                    <input type="text" placeholder="e.g. BU-2026-001" required>
                </label>
                <label>
                    Password
                    <input type="password" placeholder="Enter your password" required>
                </label>
                <button type="submit" class="portal-submit portal-student-submit">Log In</button>
            </form>

            <div class="portal-actions">
                <a href="index.html">Back to Home</a>
                <a href="contact.html">Need help?</a>
            </div>
        </div>
    </main>
</body>
</html>
